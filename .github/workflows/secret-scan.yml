name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No base/head: on push events to main, base==HEAD makes the action
      # exit with an error before scanning anything (this workflow had
      # been failing on every push for that reason). With no range the
      # action scans the full checkout, which is what we want anyway.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown
